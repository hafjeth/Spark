<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tìm Điểm Thu Gom Rác</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        
        <!-- Leaflet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        
        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        
        <link rel="stylesheet" href="../css/map.css">
        <script src="../js/map.js" defer></script>
    </head>
    <body>
        <div class="container">
            <!-- Left Panel -->
            <div class="left-panel">
                <button class="back-button">
                   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H6" />
                        <path d="M12 19L5 12L12 5" />
                    </svg>
                </button>

                <h1 class="panel-title">Tìm điểm thu gom rác</h1>
                <p class="panel-subtitle">Nhập địa chỉ để tìm địa điểm thu gom tái chế gần bạn</p>

                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Nhập địa chỉ, quận, thành phố...">
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Chọn loại rác</h3>
                    <div class="filter-pills">
                        <button class="pill active" data-type="all">
                            <span><img src="../images/map/all.png"/></span>
                            Tất cả
                        </button>
                        <button class="pill" data-type="plastic">
                            <span><img src="../images/map/plastic.png"/></span>
                            Nhựa
                        </button>
                        <button class="pill" data-type="glass">
                            <span><img src="../images/map/glass.png"/></span>
                            Thủy tinh
                        </button>
                        <button class="pill" data-type="electronics">
                            <span><img src="../images/map/elec.png"/></span>
                            Điện tử
                        </button>
                        <button class="pill" data-type="paper">
                            <span><img src="../images/map/paper.png"/></span>
                            Giấy
                        </button>
                    </div>
                </div>

                <div class="location-list" id="locationList"></div>
            </div>

            <!-- Map Area -->
            <div class="map-area">
                <div class="map-container" id="mapContainer"></div>
                <div class="map-controls">
                    <button class="map-control-btn" id="zoomIn">+</button>
                    <button class="map-control-btn" id="zoomOut">−</button>
                    <button class="map-control-btn" id="locate">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                            <circle cx="12" cy="12" r="3" fill="white"/>
                            <path d="M12 2V5M12 19V22M22 12H19M5 12H2" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel" id="rightPanel">
                <h2 class="detail-title">Chi tiết địa điểm</h2>
                <h3 class="detail-section-title" id="detailName">Trung tâm tái chế trung tâm</h3>
                <p class="detail-address" id="detailAddress">123 Đường Hùng Xanh, Phường X, Quận Y</p>

                <div class="status-box">
                    <div class="status-label">Đang mở</div>
                    <div class="status-time" id="detailHours">Giờ hoạt động: 8:00 - 17:00</div>
                </div>

                <h4 class="waste-types-title">Loại rác tiếp nhận</h4>
                <div class="waste-types" id="detailTypes">
                    <span class="waste-pill">
                        <span><img src="../images/map/plastic.png"/></span>
                        Nhựa
                    </span>
                    <span class="waste-pill">
                        <span><img src="../images/map/glass.png"/></span>
                        Thủy tinh
                    </span>
                    <span class="waste-pill">
                        <span><img src="../images/map/paper.png"/></span>
                        Giấy
                    </span>
                </div>

                <button class="directions-btn" id="directionsBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M9 11L12 14L22 4M21 12V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    Chỉ đường
                </button>
            </div>
        </div>
    </body>
</html>
