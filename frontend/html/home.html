<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecyGo - Vì một Hành tinh Xanh hơn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <img src="../images/logo.png" alt="RecyGo Logo" class="logo-image">
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="title">
                Vì một Hành tinh <span class="title-highlight">Xanh</span> hơn
            </h1>
            
            <p class="description">
                Sử dụng công nghệ AI để phân loại rác thải và khám phá các điểm thu gom gần bạn.<br>
                Cùng chúng tôi chung tay xây dựng một tương lai bền vững.
            </p>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-classify">
                    <img src="../images/lens.png" alt="Recycle" class="btn-icon-classify">
                    <span class="btn-text-classify">Phân loại rác</span>
                </button>
                
                <button class="btn btn-location">
                    <img src="../images/location.png" alt="Location" class="btn-icon-location">
                    <span class="btn-text-location">Điểm thu gom</span>
                </button>
            </div>
        </main>

        <!-- Background Image -->
        <div class="background-grid">
            <img src="../images/bg.jpg" alt="Grid Background" class="background-grid-image">
        </div>
    </div>

    <script src="../js/home.js"></script>
</body>
</html>
